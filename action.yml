name: 'Agent Instructions Kit'
description: 'Check and lint your AGENTS.md and CLAUDE.md files for consistency and safety'
author: 'HeyTC'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  mode:
    description: 'Mode to run: check, safety, or all'
    required: false
    default: 'check'
  template:
    description: 'Template flavor for init: minimal or opinionated'
    required: false
    default: 'minimal'
  fail_on_safety:
    description: 'Fail CI if safety rules are triggered'
    required: false
    default: 'false'
  diff_mode:
    description: 'Diff-aware safety: off (scan whole file, default) or force (only report safety findings on lines changed in the current git diff). Reduces noise on large existing files. The quality score always uses the full file.'
    required: false
    default: 'off'
  agents_path:
    description: 'Path to AGENTS.md file'
    required: false
    default: 'AGENTS.md'
  claude_path:
    description: 'Path to CLAUDE.md file'
    required: false
    default: 'CLAUDE.md'
  gemini_path:
    description: 'Path to GEMINI.md file (optional)'
    required: false
    default: 'GEMINI.md'

outputs:
  check_passed:
    description: 'Whether the check passed (true/false)'
  safety_passed:
    description: 'Whether safety check passed (true/false)'
  warnings:
    description: 'Number of safety warnings found'
  score:
    description: 'Quality score (0-100)'
  grade:
    description: 'Quality grade (A-F)'

runs:
  using: 'node24'
  main: 'dist/index.js'
