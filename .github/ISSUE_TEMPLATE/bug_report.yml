name: Bug Report
description: Report a bug in agent-instructions-kit
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `npx agent-instructions-kit check`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: usage
    attributes:
      label: How are you using agent-instructions-kit?
      options:
        - CLI (npx)
        - GitHub Action
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx agent-instructions-kit --version` or the Action ref you're using.
      placeholder: "v0.1.0"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.x"
